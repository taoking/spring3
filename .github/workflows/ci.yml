name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Run Testcontainers integration tests
        run: ./mvnw -B -Pintegration-test verify

      - name: Run RabbitMQ integration tests
        run: >
          ./mvnw -B -Prabbitmq,integration-test -pl order-service -am
          -Dtest=none
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=OrderRabbitMqProfileIT
          -Dfailsafe.failIfNoSpecifiedTests=false
          verify

server:
  port: 8080

spring:
  application:
    name: order-service
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5m,recordStats
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          catalog-service:
            connect-timeout: 500
            read-timeout: 800
            logger-level: basic

demo:
  order:
    currency: CNY
    notification-delay: PT0.1S
    heartbeat-delay: PT60S
  clients:
    catalog:
      mode: feign
      base-url: http://localhost:8081
      username: user
      password: user123
      connect-timeout: 500ms
      read-timeout: 800ms

resilience4j:
  circuitbreaker:
    instances:
      catalog-service:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  timelimiter:
    instances:
      catalog-service:
        timeout-duration: 1s

management:
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce:
        - w3c
      consume:
        - w3c
        - b3
        - b3_multi
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      export:
        enabled: ${ZIPKIN_TRACING_ENABLED:true}
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

info:
  app:
    name: order-service
    description: Order consumer for the Spring Boot 3 learning lab

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENV:local}
  release: spring3-learning@0.0.1-SNAPSHOT
  traces-sample-rate: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
  level:
    com.taoking.spring3.order.client: DEBUG

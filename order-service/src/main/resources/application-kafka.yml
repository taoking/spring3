spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:1000}
        spring.json.add.type.headers: false
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:spring3-order-preview}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.taoking.spring3.order.messaging.kafka.OrderPreviewKafkaEvent
        spring.json.trusted.packages: com.taoking.spring3.order.messaging.kafka
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false

demo:
  messaging:
    kafka:
      topic: ${ORDER_KAFKA_TOPIC:spring3.order-preview.events.v1}
      retry-topic: ${ORDER_KAFKA_RETRY_TOPIC:spring3.order-preview.retry.v1}
      dead-letter-topic: ${ORDER_KAFKA_DLT_TOPIC:spring3.order-preview.dlt.v1}
      consumer-group: ${ORDER_KAFKA_CONSUMER_GROUP:spring3-order-preview}
      poison-sku: ${ORDER_KAFKA_POISON_SKU:SKU-KAFKA-FAIL}
      partitions: ${ORDER_KAFKA_PARTITIONS:3}
      replication-factor: ${ORDER_KAFKA_REPLICATION_FACTOR:1}
      listener-concurrency: ${ORDER_KAFKA_LISTENER_CONCURRENCY:3}
      retry-backoff: ${ORDER_KAFKA_RETRY_BACKOFF:100ms}
      retry-max-attempts: ${ORDER_KAFKA_RETRY_MAX_ATTEMPTS:1}
  kafka:
    examples:
      topic: ${KAFKA_DEMO_TOPIC:spring3.kafka-demo.events.v1}
      retry-input-topic: ${KAFKA_DEMO_RETRY_INPUT_TOPIC:spring3.kafka-demo.retry.input.v1}
      retry-topic: ${KAFKA_DEMO_RETRY_TOPIC:spring3.kafka-demo.retry.wait.v1}
      retry-dlt-topic: ${KAFKA_DEMO_RETRY_DLT_TOPIC:spring3.kafka-demo.retry.dlt.v1}
      schema-topic: ${KAFKA_DEMO_SCHEMA_TOPIC:spring3.kafka-demo.schema.v1}
      transaction-input-topic: ${KAFKA_DEMO_TX_INPUT_TOPIC:spring3.kafka-demo.tx.input.v1}
      transaction-audit-topic: ${KAFKA_DEMO_TX_AUDIT_TOPIC:spring3.kafka-demo.tx.audit.v1}
      lag-topic: ${KAFKA_DEMO_LAG_TOPIC:spring3.kafka-demo.lag.v1}
      consumer-group: ${KAFKA_DEMO_CONSUMER_GROUP:spring3-kafka-demo}
      retry-consumer-group: ${KAFKA_DEMO_RETRY_CONSUMER_GROUP:spring3-kafka-demo-retry}
      schema-consumer-group: ${KAFKA_DEMO_SCHEMA_CONSUMER_GROUP:spring3-kafka-demo-schema}
      transaction-consumer-group: ${KAFKA_DEMO_TX_CONSUMER_GROUP:spring3-kafka-demo-tx}
      lag-consumer-group: ${KAFKA_DEMO_LAG_CONSUMER_GROUP:spring3-kafka-demo-lag}
      partitions: ${KAFKA_DEMO_PARTITIONS:3}
      replication-factor: ${KAFKA_DEMO_REPLICATION_FACTOR:1}
      retry-max-attempts: ${KAFKA_DEMO_RETRY_MAX_ATTEMPTS:2}
      max-processing-delay: ${KAFKA_DEMO_MAX_PROCESSING_DELAY:5s}
      transaction-id-prefix: ${KAFKA_DEMO_TRANSACTION_ID_PREFIX:spring3-kafka-demo-tx-}

management:
  health:
    kafka:
      enabled: true

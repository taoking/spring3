server:
  port: 8081

spring:
  application:
    name: catalog-service
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false

demo:
  security:
    mode: basic
  observability:
    demolog:
      enabled: true
      slow-threshold: 500ms
  catalog:
    slow-delay: 2s
    products:
      - id: 1
        sku: SKU-1001
        name: Spring Boot 3 Guide
        price: 99.00
        active: true
      - id: 2
        sku: SKU-1002
        name: Observability Workbook
        price: 129.00
        active: true
      - id: 3
        sku: SKU-1003
        name: Feign Practice Kit
        price: 79.00
        active: true

management:
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce:
        - w3c
      consume:
        - w3c
        - b3
        - b3_multi
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      export:
        enabled: ${ZIPKIN_TRACING_ENABLED:true}
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

info:
  app:
    name: catalog-service
    description: Product provider for the Spring Boot 3 learning lab

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENV:local}
  release: spring3-learning@0.0.1-SNAPSHOT
  traces-sample-rate: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false

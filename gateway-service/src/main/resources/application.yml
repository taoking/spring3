server:
  port: 8088

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:3000
                  - http://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

demo:
  gateway:
    routes:
      catalog-uri: http://localhost:8081
      order-uri: http://localhost:8080
      order-canary-uri: ${DEMO_GATEWAY_ROUTES_ORDER_CANARY_URI:http://localhost:8080}
    rate-limit:
      enabled: true
      requests-per-window: 60
      window: 1m

resilience4j:
  circuitbreaker:
    instances:
      catalog-route:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
      orders-route:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  timelimiter:
    instances:
      catalog-route:
        timeout-duration: 2s
      orders-route:
        timeout-duration: 2s

management:
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce:
        - w3c
      consume:
        - w3c
        - b3
        - b3_multi
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      access: read_only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      export:
        enabled: ${ZIPKIN_TRACING_ENABLED:true}
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

info:
  app:
    name: gateway-service
    description: API gateway for the Spring Boot 3 learning lab

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
  level:
    com.taoking.spring3.gateway: INFO

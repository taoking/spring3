server:
  port: 8088

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false

demo:
  gateway:
    routes:
      catalog-uri: http://localhost:8081
      order-uri: http://localhost:8080
    rate-limit:
      enabled: true
      requests-per-window: 60
      window: 1m

resilience4j:
  circuitbreaker:
    instances:
      catalog-route:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
      orders-route:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  timelimiter:
    instances:
      catalog-route:
        timeout-duration: 2s
      orders-route:
        timeout-duration: 2s

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      access: read_only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: gateway-service
    description: API gateway for the Spring Boot 3 learning lab

logging:
  level:
    com.taoking.spring3.gateway: INFO

server {
    listen 80;
    server_name localhost;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location = /api/catalog/products/SKU-TC {
        default_type application/json;
        return 200 '{"id":301,"sku":"SKU-TC","name":"Testcontainers Product","price":49.00,"active":true,"fallback":false}';
    }

    location / {
        default_type application/json;
        return 404 '{"title":"Container backend not found","status":404}';
    }
}
